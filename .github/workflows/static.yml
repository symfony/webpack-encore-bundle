on: [pull_request]
name: Static analysis

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@529ee057c4434195612e6712b010adc92893e0ef
        with:
          php-version: 8.1
          coverage: none
          tools: cs2pr

      - name: Download dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6

      - name: Install PHPStan
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6
        with:
          composer-options: "--working-dir=tools/phpstan"

      - name: PHPStan
        run: tools/phpstan/vendor/bin/phpstan analyze --no-progress --error-format=checkstyle | cs2pr

  psalm:
    name: Psalm
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@529ee057c4434195612e6712b010adc92893e0ef
        with:
          php-version: 8.1
          coverage: none
          tools: vimeo/psalm:4.11.2

      - name: Download dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6

      - name: Install psalm
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6
        with:
          composer-options: "--working-dir=tools/psalm"

      - name: Psalm
        run: tools/psalm/vendor/bin/psalm --no-progress

  composer-normalize:
    name: Composer Normalize
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@529ee057c4434195612e6712b010adc92893e0ef
        with:
          php-version: 8.1
          coverage: none
          tools: composer-normalize

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Normalize
        run: composer-normalize --dry-run
